name: PG4WP CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PG4WP_TEST_DSN: host=localhost port=5432 dbname=pg4wp_test user=pg4wp password=pg4wp

jobs:
  lint:
    name: Syntax Check PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP Lint
        run: |
          find pg4wp/ -name '*.php' -exec php -l {} \;
          find rewriters/ -name '*.php' -exec php -l {} \;

  sql-rewrite:
    name: SQL Rewrite PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Run SQL Rewrite Unit Tests
        run: php tests/tools/phpunit.phar tests/
      - name: Test Summary
        run: echo "SQL rewrite tests passed on PHP ${{ matrix.php }}"

  pgsql-integration:
    name: PG ${{ matrix.pgsql }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.2]
        pgsql: [14, 15, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.pgsql }}
        env:
          POSTGRES_PASSWORD: pg4wp
          POSTGRES_DB: pg4wp_test
          POSTGRES_USER: pg4wp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U pg4wp && break
            sleep 2
          done
      - name: Run Integration Tests
        env:
          PG4WP_TEST_DSN: ${{ env.PG4WP_TEST_DSN }}
        run: |
          php -r "
            \$conn = pg_connect(getenv('PG4WP_TEST_DSN'));
            if (!\$conn) { echo 'PG connection failed'; exit(1); }
            echo 'Connected to PostgreSQL ' . pg_version(\$conn)['server'] . '\n';
            pg_close(\$conn);
          "
          php tests/tools/phpunit.phar tests/ --verbose
      - name: Log on failure
        if: failure()
        run: |
          pg_isready -h localhost -U pg4wp
          psql "$PG4WP_TEST_DSN" -c "SELECT version();"

  wordpress-install:
    name: WP ${{ matrix.wp }} on PG16 / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3]
        wp: [6.4, 6.5, 6.6, latest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg4wp
          POSTGRES_DB: wordpress
          POSTGRES_USER: pg4wp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql
          tools: wp-cli
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U pg4wp && break
            sleep 2
          done
      - name: Install WordPress ${{ matrix.wp }} with PostgreSQL
        run: |
          WP_VERSION="${{ matrix.wp }}"
          [ "$WP_VERSION" = "latest" ] && WP_VERSION=""
          wp core download --version=$WP_VERSION --path=/tmp/wordpress --allow-root
          cp -r "$GITHUB_WORKSPACE" /tmp/wordpress/wp-content/plugins/pg4wp
          cd /tmp/wordpress
          wp config create \
            --dbname=wordpress \
            --dbuser=pg4wp \
            --dbpass=pg4wp \
            --dbhost=localhost \
            --allow-root
          cp wp-content/plugins/pg4wp/db.php wp-content/db.php
          wp core install \
            --url=http://localhost:8080 \
            --title="PG4WP Test" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=test@example.com \
            --allow-root
      - name: WordPress Smoke Tests
        run: |
          cd /tmp/wordpress
          wp post list --allow-root
          wp user list --allow-root
          wp plugin list --allow-root
          wp db check --allow-root || echo "db check warning (non-fatal)"
      - name: Plugin Integration Test
        run: |
          cd /tmp/wordpress
          wp plugin activate pg4wp --allow-root
          wp post create --post_title="PG4WP Test" --post_content="Hello PostgreSQL" --post_status=publish --allow-root
          wp post list --posts_per_page=5 --allow-root

  woocommerce-install:
    name: WC ${{ matrix.wc }} + WP ${{ matrix.wp }} on PG16 / PHP 8.2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: [6.5, 6.6, latest]
        wc: [8.9, 9.3, latest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg4wp
          POSTGRES_DB: wordpress
          POSTGRES_USER: pg4wp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pgsql
          tools: wp-cli
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U pg4wp && break
            sleep 2
          done
      - name: Install WordPress ${{ matrix.wp }}
        run: |
          WP_VERSION="${{ matrix.wp }}"
          [ "$WP_VERSION" = "latest" ] && WP_VERSION=""
          wp core download --version=$WP_VERSION --path=/tmp/wordpress --allow-root
          cp -r "$GITHUB_WORKSPACE" /tmp/wordpress/wp-content/plugins/pg4wp
          cd /tmp/wordpress
          wp config create \
            --dbname=wordpress \
            --dbuser=pg4wp \
            --dbpass=pg4wp \
            --dbhost=localhost \
            --allow-root
          cp wp-content/plugins/pg4wp/db.php wp-content/db.php
          wp core install \
            --url=http://localhost:8080 \
            --title="PG4WP WC Test" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=test@example.com \
            --allow-root
      - name: Install WooCommerce ${{ matrix.wc }}
        run: |
          cd /tmp/wordpress
          WC_VERSION="${{ matrix.wc }}"
          [ "$WC_VERSION" = "latest" ] && WC_VERSION=""
          if [ -n "$WC_VERSION" ]; then
            wp plugin install woocommerce --version=$WC_VERSION --activate --allow-root
          else
            wp plugin install woocommerce --activate --allow-root
          fi
      - name: WooCommerce Smoke Tests
        run: |
          cd /tmp/wordpress
          wp plugin list --allow-root
          wp wc --allow-root help 2>/dev/null || echo "WC CLI check"
          wp post list --post_type=product --allow-root || echo "No products yet (expected)"
      - name: Create WooCommerce Product
        run: |
          cd /tmp/wordpress
          wp post create \
            --post_title="Test Product" \
            --post_content="PG4WP compatible" \
            --post_status=publish \
            --post_type=product \
            --allow-root || echo "Product creation test (may fail until rewrites are complete)"
